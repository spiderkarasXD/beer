<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>CaseBeer — кейсы, апгрейд, батлы</title>
  <meta name="theme-color" content="#0b0f1a">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ticker">
    <div class="ticker-label"><span class="dot"></span>Live</div>
    <div class="ticker-track" id="tickerTrack"></div>
  </div>

  <header class="header">
    <a class="logo" href="#/"><span class="mug">🍺</span>Case<b>Beer</b></a>
    <nav class="nav" id="nav"></nav>
    <div class="stats-mini">
      <div><b id="statOnline">—</b>онлайн</div>
      <div><b id="statOpened">—</b>открыто</div>
    </div>
    <div class="wallet">
      <div class="balance" id="balance"><span id="balanceText">0 ₽</span></div>
      <button class="btn" id="topup">+</button>
      <a class="avatar" id="avatar" href="#/profile" title="Профиль">?</a>
    </div>
  </header>

  <main class="page" id="page"></main>
  <div class="footer">CaseBeer — игра на виртуальные рубли. Настоящие деньги не принимаются и не выводятся. · <a href="../">Beer Translate</a></div>

  <nav class="mnav" id="mnav"></nav>
  <div class="toasts" id="toasts"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
