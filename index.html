<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Beer Translate</title>
  <meta name="description" content="Переводчик с русского и английского на пивной язык + игры и казино.">
  <meta name="theme-color" content="#fff8f2" id="metaTheme">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍺</text></svg>">
  <script>
    (function () {
      var t = 'system';
      try { t = JSON.parse(localStorage.getItem('beer:theme')) || 'system'; } catch (e) {}
      var dark = t === 'dark' || (t === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800;900&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..700,0..1,0&display=block">
  <link rel="stylesheet" href="assets/css/m3.css">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
  <div class="app">
    <!-- Navigation rail (desktop) -->
    <nav class="rail" aria-label="Навигация">
      <a class="logo" href="#/translate" title="Beer Translate">🍺</a>
      <a class="dest" href="#/translate" data-nav="translate"><span class="ind"><span class="ms">translate</span></span>Перевод</a>
      <a class="dest" href="#/games" data-nav="games"><span class="ind"><span class="ms">sports_esports</span></span>Игры</a>
      <a class="dest" href="#/sections" data-nav="sections"><span class="ind"><span class="ms">apps</span></span>Разделы</a>
      <div class="spacer"></div>
      <button class="icon-btn sl" data-action="theme" title="Тема"><span class="ms">dark_mode</span></button>
    </nav>

    <div class="main">
      <header class="topbar" id="topbar">
        <button class="icon-btn sl back" id="backBtn" hidden title="Назад"><span class="ms">arrow_back</span></button>
        <div class="title" id="pageTitle">Beer Translate</div>
        <a class="balance-chip" id="balanceChip" href="#/casino" hidden style="text-decoration:none"><span class="ms fill">payments</span><span id="balanceText">$10.00</span></a>
        <button class="icon-btn sl topbar-theme" data-action="theme" title="Тема"><span class="ms">dark_mode</span></button>
      </header>

      <div class="view-wrap">
        <main id="view" class="view"></main>
      </div>
    </div>

    <!-- Navigation bar (mobile) -->
    <nav class="navbar" aria-label="Навигация">
      <a class="dest" href="#/translate" data-nav="translate"><span class="ind"><span class="ms">translate</span></span>Перевод</a>
      <a class="dest" href="#/games" data-nav="games"><span class="ind"><span class="ms">sports_esports</span></span>Игры</a>
      <a class="dest" href="#/sections" data-nav="sections"><span class="ind"><span class="ms">apps</span></span>Разделы</a>
    </nav>
  </div>

  <div class="snackbar" id="snackbar" role="status" aria-live="polite"><span id="snackText"></span></div>

  <script src="assets/js/core.js" defer></script>
  <script src="assets/js/translator.js" defer></script>
  <script src="assets/js/games.js" defer></script>
  <script src="assets/js/casino.js" defer></script>
  <script src="assets/js/app.js" defer></script>
</body>
</html>
